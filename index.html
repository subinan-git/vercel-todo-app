<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할일 목록</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    .container {
      max-width: 480px;
      margin: 48px auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 20px; font-size: 1.6rem; text-align: center; }
    form { display: flex; gap: 8px; }
    #todo-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    button:hover { opacity: 0.9; }
    ul { list-style: none; margin: 20px 0 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #eee;
    }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li span { flex: 1; word-break: break-all; }
    li.done span { text-decoration: line-through; color: #999; }
    .delete-btn { background: #ef4444; padding: 6px 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>나의 할일 목록</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할일을 입력하세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <ul id="todo-list"></ul>
  </div>

  <script>
    const STORAGE_KEY = "todos";
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    let todos = loadTodos();

    function render() {
      list.innerHTML = "";
      todos.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          saveTodos();
          render();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "삭제";
        delBtn.addEventListener("click", () => {
          todos = todos.filter((t) => t.id !== todo.id);
          saveTodos();
          render();
        });

        li.append(checkbox, text, delBtn);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      saveTodos();
      render();
      input.value = "";
      input.focus();
    });

    render();
  </script>
</body>
</html>
